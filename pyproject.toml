[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-code-agent"
version = "0.2.0"
description = "A Pi-inspired Python coding agent and reusable agent harness."
readme = "README.md"
license-files = ["docs/third-party-notices.md"]
requires-python = ">=3.12"
# s05：SDK 下界采用实际验证版本，避免把未核实的早期版本声明为支持流式字段。
dependencies = ["anthropic>=1.6.0", "openai>=3.19.0", "python-dotenv>=1.0.0", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9.0", "setuptools>=77", "wheel>=0.43"]

[project.scripts]
pi-code-agent = "pi_code_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pi_code_agent*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
addopts = "-q"
norecursedirs = ["archive", ".sessions", ".git", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive", ".sessions"]
