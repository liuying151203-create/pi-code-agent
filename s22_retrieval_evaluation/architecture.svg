<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-labelledby="title desc"><title id="title">s22 · 标签隔离与定位评测</title><desc id="desc">任务与标签分开，定位器只接收盲任务，评分器保留全部失败分母。真实会话成本单列，不冒充 Agent 排名。</desc><style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#181c21);--fg:light-dark(#242a31,#e7ecf1);--surface:light-dark(#f4f6f8,#232a32);--line:light-dark(#677482,#b6c4d2)}
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:var(--fg)}
.title{font-size:25px;font-weight:500}.heading{font-size:20px;font-weight:500}.body{font-size:17px}.label{font-size:16px}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.4}.wire{fill:none;stroke:var(--line);stroke-width:1.6;marker-end:url(#arrow)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--line)"/></marker></defs><rect width="1240" height="820" fill="var(--bg)"/><text class="title" x="40" y="38">s22 · 标签隔离与定位评测</text><g id="dataset"><rect class="box" x="40" y="70" width="260" height="120" rx="8"/><text class="heading" x="170" y="104" text-anchor="middle">目标外固定样本</text><text class="body" x="170" y="138" text-anchor="middle">任务＋源码版本＋gold</text><text class="body" x="170" y="172" text-anchor="middle">先检查位置与有效性</text></g><g id="split"><rect class="box" x="420" y="70" width="360" height="120" rx="8"/><text class="heading" x="600" y="104" text-anchor="middle">s22 · load_cases</text><text class="body" x="600" y="138" text-anchor="middle">SearchTask / EvaluationCase</text><text class="body" x="600" y="172" text-anchor="middle">输入和答案分开</text></g><g id="workspace"><rect class="box" x="40" y="350" width="260" height="160" rx="8"/><text class="heading" x="170" y="384" text-anchor="middle">独立目标项目</text><text class="body" x="170" y="418" text-anchor="middle">固定源码字节版本</text><text class="body" x="170" y="452" text-anchor="middle">不包含标签／结果</text></g><g id="locator"><rect class="box" x="420" y="350" width="360" height="160" rx="8"/><text class="heading" x="600" y="384" text-anchor="middle">ComponentLocator</text><text class="body" x="600" y="418" text-anchor="middle">固定策略，不接收 gold</text><text class="body" x="600" y="452" text-anchor="middle">basic / 文本 / 混合 / 关系</text></g><g id="evaluator"><rect class="box" x="940" y="350" width="260" height="160" rx="8"/><text class="heading" x="1070" y="384" text-anchor="middle">EvaluationRunner</text><text class="body" x="1070" y="418" text-anchor="middle">复核版本／评分</text><text class="body" x="1070" y="452" text-anchor="middle">失败仍在分母</text></g><g id="session"><rect class="box" x="40" y="650" width="260" height="90" rx="8"/><text class="heading" x="170" y="684" text-anchor="middle">已有 Session</text><text class="body" x="170" y="718" text-anchor="middle">只读统计回答／摘要／失败</text></g><g id="report"><rect class="box" x="940" y="650" width="260" height="90" rx="8"/><text class="heading" x="1070" y="684" text-anchor="middle">目标外评测报告</text><text class="body" x="1070" y="718" text-anchor="middle">Recall / Hit / MRR / 成本</text></g><path class="wire" d="M300 130H420"/><text class="label" x="360" y="115" text-anchor="middle">读取</text><path class="wire" d="M600 190V350"/><text class="label" x="680" y="275" text-anchor="middle">无 gold 的任务</text><path class="wire" d="M780 130H1070V350"/><text class="label" x="1090" y="275" text-anchor="middle">标签只给评分器</text><path class="wire" d="M300 430H420"/><text class="label" x="360" y="415" text-anchor="middle">允许源码</text><path class="wire" d="M780 430H940"/><text class="label" x="860" y="415" text-anchor="middle">候选／失败</text><path class="wire" d="M1070 510V650"/><text class="label" x="1140" y="580" text-anchor="middle">全任务评分</text><path class="wire" d="M300 695H940"/><text class="label" x="620" y="680" text-anchor="middle">独立会话成本：不推断 Agent 最终排名</text></svg>
