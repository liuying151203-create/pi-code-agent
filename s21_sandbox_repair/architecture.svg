<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-labelledby="title desc"><title id="title">s21 · 同源隔离副本与修复验收</title><desc id="desc">维护编排运行 Agent；检索和读取来自同一容器。固定验证在无网络副本中执行，版本核对后由用户确认交付。</desc><style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#181c21);--fg:light-dark(#242a31,#e7ecf1);--surface:light-dark(#f4f6f8,#232a32);--line:light-dark(#677482,#b6c4d2)}
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:var(--fg)}
.title{font-size:25px;font-weight:500}.heading{font-size:20px;font-weight:500}.body{font-size:17px}.label{font-size:16px}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.4}.wire{fill:none;stroke:var(--line);stroke-width:1.6;marker-end:url(#arrow)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--line)"/></marker></defs><rect width="1240" height="820" fill="var(--bg)"/><text class="title" x="40" y="38">s21 · 同源隔离副本与修复验收</text><g id="user"><rect class="box" x="40" y="70" width="230" height="90" rx="8"/><text class="heading" x="155" y="104" text-anchor="middle">用户</text><text class="body" x="155" y="138" text-anchor="middle">维护任务</text></g><g id="repair"><rect class="box" x="370" y="70" width="360" height="110" rx="8"/><text class="heading" x="550" y="104" text-anchor="middle">s21 · RepairRunner</text><text class="body" x="550" y="138" text-anchor="middle">运行 → 验证 → 有界反馈</text></g><g id="original"><rect class="box" x="940" y="70" width="260" height="110" rx="8"/><text class="heading" x="1070" y="104" text-anchor="middle">宿主原项目</text><text class="body" x="1070" y="138" text-anchor="middle">复制输入／确认后回写</text></g><g id="agent"><rect class="box" x="40" y="300" width="230" height="160" rx="8"/><text class="heading" x="155" y="334" text-anchor="middle">AgentRuntime</text><text class="body" x="155" y="368" text-anchor="middle">本地完整循环</text><text class="body" x="155" y="402" text-anchor="middle">基础工具＋检索扩展</text></g><g id="repository-retrieval"><rect class="box" x="370" y="300" width="360" height="160" rx="8"/><text class="heading" x="550" y="334" text-anchor="middle">当前容器源码视图</text><text class="body" x="550" y="368" text-anchor="middle">读取／检索同源</text><text class="body" x="550" y="402" text-anchor="middle">s19 召回、证据与关系</text></g><g id="workspace"><rect class="box" x="940" y="300" width="260" height="160" rx="8"/><text class="heading" x="1070" y="334" text-anchor="middle">隔离副本 /work</text><text class="body" x="1070" y="368" text-anchor="middle">无网络／无宿主挂载</text><text class="body" x="1070" y="402" text-anchor="middle">固定验证也在这里执行</text></g><g id="records"><rect class="box" x="40" y="650" width="230" height="110" rx="8"/><text class="heading" x="155" y="684" text-anchor="middle">Harness 记录</text><text class="body" x="155" y="718" text-anchor="middle">Session / Trace</text><text class="body" x="155" y="752" text-anchor="middle">验证 JSON / 待确认 Diff</text></g><g id="zoekt"><rect class="box" x="370" y="650" width="360" height="110" rx="8"/><text class="heading" x="550" y="684" text-anchor="middle">Zoekt 短容器</text><text class="body" x="550" y="718" text-anchor="middle">过滤副本的文本／符号索引</text></g><g id="index-cache"><rect class="box" x="940" y="650" width="260" height="110" rx="8"/><text class="heading" x="1070" y="684" text-anchor="middle">宿主目标内缓存</text><text class="body" x="1070" y="718" text-anchor="middle">.indexes/s21/</text><text class="body" x="1070" y="752" text-anchor="middle">版本来自容器，不是宿主</text></g><path class="wire" d="M270 115H370"/><text class="label" x="320" y="100" text-anchor="middle">任务</text><path class="wire" d="M370 150H315V350H270"/><text class="label" x="315" y="245" text-anchor="middle">运行 Agent</text><path class="wire" d="M155 300V225H1070V300"/><text class="label" x="610" y="210" text-anchor="middle">写工具／shell：只到隔离副本</text><path class="wire" d="M730 125H835V330H940"/><text class="label" x="835" y="260" text-anchor="middle">固定验证</text><path class="wire" d="M1070 180V300" marker-start="url(#arrow)"/><text class="label" x="1090" y="265" text-anchor="middle">复制／确认交付</text><path class="wire" d="M270 385H370"/><text class="label" x="320" y="370" text-anchor="middle">检索／读取</text><path class="wire" d="M940 400H730"/><text class="label" x="835" y="385" text-anchor="middle">当前源码与版本</text><path class="wire" d="M155 460V650"/><text class="label" x="220" y="560" text-anchor="middle">保存运行事实</text><path class="wire" d="M520 460V650"/><text class="label" x="575" y="560" text-anchor="middle">索引／查询</text><path class="wire" d="M940 705H730"/><text class="label" x="835" y="690" text-anchor="middle">副本／分片挂载</text></svg>
