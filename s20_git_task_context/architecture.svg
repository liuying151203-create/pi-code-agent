<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-labelledby="title desc"><title id="title">s20 · 任务上下文与既有检索</title><desc id="desc">用户资料与本地 Git 对象组成有界任务输入，交给既有 Agent 和检索；原源码只读，索引与运行记录隔离。</desc><style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#181c21);--fg:light-dark(#242a31,#e7ecf1);--surface:light-dark(#f4f6f8,#232a32);--line:light-dark(#677482,#b6c4d2)}
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:var(--fg)}
.title{font-size:25px;font-weight:500}.heading{font-size:20px;font-weight:500}.body{font-size:17px}.label{font-size:16px}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.4}.wire{fill:none;stroke:var(--line);stroke-width:1.6;marker-end:url(#arrow)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--line)"/></marker></defs><rect width="1240" height="820" fill="var(--bg)"/><text class="title" x="40" y="38">s20 · 任务上下文与既有检索</text><g id="user"><rect class="box" x="40" y="70" width="220" height="90" rx="8"/><text class="heading" x="150" y="104" text-anchor="middle">用户</text><text class="body" x="150" y="138" text-anchor="middle">需求／显式资料</text></g><g id="task-context"><rect class="box" x="390" y="70" width="370" height="140" rx="8"/><text class="heading" x="575" y="104" text-anchor="middle">s20 · TaskContextBuilder</text><text class="body" x="575" y="138" text-anchor="middle">任务资料＋只读 Git 对象</text><text class="body" x="575" y="172" text-anchor="middle">差异／来源／版本与预算</text></g><g id="workspace"><rect class="box" x="950" y="70" width="250" height="140" rx="8"/><text class="heading" x="1075" y="104" text-anchor="middle">目标仓库</text><text class="body" x="1075" y="138" text-anchor="middle">允许源码／本地 Git</text><text class="body" x="1075" y="172" text-anchor="middle">不读取父 Harness 历史</text></g><g id="agent"><rect class="box" x="40" y="360" width="220" height="160" rx="8"/><text class="heading" x="150" y="394" text-anchor="middle">Agent 运行区</text><text class="body" x="150" y="428" text-anchor="middle">本地完整 agent_loop</text><text class="body" x="150" y="462" text-anchor="middle">既有工具注册</text></g><g id="repository-retrieval"><rect class="box" x="390" y="360" width="370" height="160" rx="8"/><text class="heading" x="575" y="394" text-anchor="middle">检索模块 · 来自 s19</text><text class="body" x="575" y="428" text-anchor="middle">文本／符号／可选语义</text><text class="body" x="575" y="462" text-anchor="middle">有来源的代码与关系证据</text></g><g id="index-cache"><rect class="box" x="950" y="360" width="250" height="160" rx="8"/><text class="heading" x="1075" y="394" text-anchor="middle">目标内缓存</text><text class="body" x="1075" y="428" text-anchor="middle"> .indexes/s20/</text><text class="body" x="1075" y="462" text-anchor="middle">不向模型开放</text></g><g id="records"><rect class="box" x="390" y="650" width="370" height="90" rx="8"/><text class="heading" x="575" y="684" text-anchor="middle">Harness 中的记录</text><text class="body" x="575" y="718" text-anchor="middle">Session / Trace / 检索指标</text></g><path class="wire" d="M260 115H390"/><text class="label" x="325" y="100" text-anchor="middle">①任务</text><path class="wire" d="M950 155H760"/><text class="label" x="855" y="140" text-anchor="middle">②允许源码／对象</text><path class="wire" d="M390 185H320V400H260"/><text class="label" x="320" y="285" text-anchor="middle">③用户消息</text><path class="wire" d="M260 440H390"/><text class="label" x="325" y="425" text-anchor="middle">④检索</text><path class="wire" d="M390 490H260"/><text class="label" x="325" y="475" text-anchor="middle">⑤证据</text><path class="wire" d="M760 440H950"/><text class="label" x="855" y="425" text-anchor="middle">专用缓存读写</text><path class="wire" d="M1080 210V300H700V360"/><text class="label" x="900" y="285" text-anchor="middle">同一目标</text><path class="wire" d="M150 520V600H470V650"/><text class="label" x="250" y="585" text-anchor="middle">保存消息与用量</text><path class="wire" d="M650 520V650"/><text class="label" x="690" y="590" text-anchor="middle">保存指标</text></svg>
